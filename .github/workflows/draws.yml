name: update-draws

on:
  schedule:
    - cron: '50 12 * * *'
    - cron: '40 13 * * *'
    - cron: '40 14 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency: update-draws

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: fetch draws
        run: |
          python3 - <<'PY'
          import json, os, re, sys, time, urllib.request
          from datetime import datetime, timezone, timedelta

          URLS = ['https://m.500.com/info/kaijiang/']
          UA = 'Mozilla/5.0 (iPhone; CPU iPhone OS 17_0 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/17.0 Mobile/15E148 Safari/604.1'
          NAMES = {'超级大乐透': 'dlt', '双色球': 'ssq', '7星彩': 'qxc', '七星彩': 'qxc', '排列3': 'p3', '排列5': 'p5', '快乐8': 'kl8'}
          SPEC = {'ssq': [6, 1], 'dlt': [5, 2], 'qxc': [6, 1], 'p3': [3], 'p5': [5], 'kl8': [20]}

          def fetch(url):
              last = None
              for _ in range(3):
                  try:
                      req = urllib.request.Request(url, headers={'User-Agent': UA, 'Accept-Language': 'zh-CN,zh;q=0.9', 'Accept': 'text/html,*/*'})
                      with urllib.request.urlopen(req, timeout=30) as r:
                          raw = r.read()
                      try:
                          return raw.decode('utf-8')
                      except UnicodeDecodeError:
                          return raw.decode('gb18030', errors='replace')
                  except Exception as e:
                      last = e
                      print('fetch error:', url, repr(e), file=sys.stderr)
                      time.sleep(3)
              raise last

          def to_text(html):
              html = re.sub(r'<!--[\s\S]*?-->', ' ', html)
              html = re.sub(r'<(script|style)[\s\S]*?</\1>', ' ', html, flags=re.I)
              html = re.sub(r'<[^>]+>', ' ', html)
              html = html.replace('&nbsp;', ' ')
              return re.sub(r'[ \t\r\n]+', ' ', html)

          def parse(text):
              heads = list(re.finditer(r'([^\s<>]{2,12}?)\s*(\d{5,7})期\s*(\d{4}-\d{2}-\d{2})', text))
              out = {}
              for i, m in enumerate(heads):
                  key = NAMES.get(m.group(1).strip())
                  if not key or key in out:
                      continue
                  end = heads[i + 1].start() if i + 1 < len(heads) else len(text)
                  seg = text[m.end():end]
                  run = re.search(r'(?<![\d-])((?:\d{1,2} )+\d{1,2})(?![\d-])', seg + ' ')
                  toks = [int(x) for x in run.group(1).split()] if run else []
                  spec = SPEC[key]
                  if len(toks) < sum(spec):
                      print(key, 'FAILED: expected', sum(spec), 'numbers, got', toks, '| segment:', seg[:160], file=sys.stderr)
                      continue
                  toks = toks[:sum(spec)]
                  n, o = [], 0
                  for c in spec:
                      n.append(toks[o:o + c])
                      o += c
                  out[key] = {'i': m.group(2), 'd': m.group(3), 'n': n}
              return out

          old = {}
          if os.path.exists('draws.json'):
              try:
                  old = json.load(open('draws.json', encoding='utf-8')).get('games', {})
              except Exception:
                  pass
          games = dict(old)
          got = {}
          for u in URLS:
              try:
                  got = parse(to_text(fetch(u)))
                  if got:
                      break
              except Exception as e:
                  print('source FAILED:', u, repr(e), file=sys.stderr)
          for k, v in got.items():
              games[k] = v
              print(k, 'OK', v)
          print('fetched games:', len(got))
          if not got:
              sys.exit(1)
          if games != old:
              now = datetime.now(timezone(timedelta(hours=8))).strftime('%Y-%m-%d %H:%M')
              json.dump({'updated': now, 'games': games}, open('draws.json', 'w', encoding='utf-8'), ensure_ascii=False)
          PY

      - name: commit
        run: |
          git config user.name "draws-bot"
          git config user.email "draws-bot@users.noreply.github.com"
          git add draws.json
          git diff --cached --quiet || (git commit -m "update draws" && git push)
