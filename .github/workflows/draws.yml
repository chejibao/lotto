name: update-draws

on:
  schedule:
    - cron: '50 12 * * *'
    - cron: '40 13 * * *'
    - cron: '40 14 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency: update-draws

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: fetch draws
        run: |
          python3 - <<'PY'
          import json, os, sys, time, urllib.request
          from datetime import datetime, timezone, timedelta

          UA = 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0 Safari/537.36'

          def get(url, ref):
              last = None
              for _ in range(3):
                  try:
                      req = urllib.request.Request(url, headers={'User-Agent': UA, 'Referer': ref, 'Accept': 'application/json, text/plain, */*'})
                      with urllib.request.urlopen(req, timeout=30) as r:
                          return json.loads(r.read().decode('utf-8'))
                  except Exception as e:
                      last = e
                      time.sleep(3)
              raise last

          def nums(s):
              return [int(x) for x in str(s).replace(',', ' ').split()]

          old = {}
          if os.path.exists('draws.json'):
              try:
                  old = json.load(open('draws.json', encoding='utf-8')).get('games', {})
              except Exception:
                  pass
          games = dict(old)
          ok = 0

          for key in ('ssq', 'kl8'):
              try:
                  j = get('https://www.cwl.gov.cn/cwl_admin/front/cwlkj/search/kjxx/findDrawNotice?name=%s&issueCount=1' % key,
                          'https://www.cwl.gov.cn/ygkj/wqkjgg/')
                  r = j['result'][0]
                  n = [nums(r['red'])]
                  if r.get('blue'):
                      n.append(nums(r['blue']))
                  games[key] = {'i': r['code'], 'd': r['date'][:10], 'n': n}
                  ok += 1
                  print(key, 'OK', games[key])
              except Exception as e:
                  print(key, 'FAILED:', repr(e), file=sys.stderr)

          for key, no in (('dlt', '85'), ('p3', '35'), ('p5', '350133'), ('qxc', '04')):
              try:
                  j = get('https://webapi.sporttery.cn/gateway/lottery/getHistoryPageListV1.qry?gameNo=%s&provinceId=0&pageSize=1&isVerify=1&pageNo=1' % no,
                          'https://www.lottery.gov.cn/')
                  r = j['value']['list'][0]
                  a = nums(r['lotteryDrawResult'])
                  n = {'dlt': [a[:5], a[5:]], 'qxc': [a[:6], a[6:]]}.get(key, [a])
                  games[key] = {'i': r['lotteryDrawNum'], 'd': r['lotteryDrawTime'][:10], 'n': n}
                  ok += 1
                  print(key, 'OK', games[key])
              except Exception as e:
                  print(key, 'FAILED:', repr(e), file=sys.stderr)

          print('fetched games:', ok)
          if ok == 0:
              sys.exit(1)
          if games != old:
              now = datetime.now(timezone(timedelta(hours=8))).strftime('%Y-%m-%d %H:%M')
              json.dump({'updated': now, 'games': games}, open('draws.json', 'w', encoding='utf-8'), ensure_ascii=False)
          PY

      - name: commit
        run: |
          git config user.name "draws-bot"
          git config user.email "draws-bot@users.noreply.github.com"
          git add draws.json
          git diff --cached --quiet || (git commit -m "update draws" && git push)
