<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>机选号码</title>
<style>
:root{--h1:#1b5fd6;--h2:#2f81ea;--ac:#2a74e6;--red:#2a74e6;--blue:#f39a1e;--bar:#1f68de;--btn:#ffd321;--btx:#3b2a00;--fg:#1f2430;--mut:#8a90a0;--bd:#e3e5ea;--bt:#fff;--ut:#fff;

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

body{margin:0;color:var(--fg);font:16px/1.45 -apple-system,"PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif;padding-bottom:calc(108px + env(safe-area-inset-bottom,0px))}

.tt,.tabs{max-width:560px;margin:0 auto}
.tt{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 16px 4px}

.qk{color:#fff;text-decoration:none;font-size:12px;font-weight:600;padding:3px 11px;border-radius:999px;background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.35);white-space:nowrap}
.tabs{display:flex;gap:2px;overflow-x:auto;padding:6px 10px 0;scrollbar-width:none}

.sv{flex:none;background:var(--ac);color:#fff;border-radius:999px;padding:6px 15px;font-size:13px}
.nextbar{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 14px 2px;font-size:13px;color:#5b6070}

#grids{padding:2px 14px 4px}
.zone{margin:12px 0 16px}
.zh{display:flex;align-items:baseline;gap:8px;margin-bottom:10px}
.zt{font-size:17px;font-weight:700}
.zs{font-size:12.5px;color:var(--mut)}
.gr{display:grid;grid-template-columns:repeat(7,1fr);gap:10px 9px}
.zd{display:flex;align-items:center;gap:10px;margin:8px 0 14px}
.zd .zh{flex-direction:column;align-items:flex-start;gap:2px;width:58px;flex:none;margin:0}

.nb{aspect-ratio:1;min-width:0;border-radius:50%;background:#fff;color:var(--red);font-size:19px;box-shadow:0 3px 8px rgba(30,40,70,.09),inset 0 -2px 3px rgba(30,40,70,.05)}
.nb.u{color:var(--blue)}
.nb.dan{color:var(--bt);background-color:var(--red);background-image:radial-gradient(circle at 30% 25%,rgba(255,255,255,.5),rgba(255,255,255,0) 46%);box-shadow:inset 0 -3px 5px rgba(0,0,0,.22),0 3px 8px rgba(30,40,70,.2)}
.nb.dan.u{background-color:var(--blue);color:var(--ut)}

.card{background:#fff;border-radius:18px;margin:12px 14px;padding:12px 12px 14px;box-shadow:0 4px 16px rgba(30,40,70,.06)}
h2{font-size:15px;margin:20px 16px 0;display:flex;align-items:center;gap:8px}
h2::before{content:"";width:4px;height:15px;border-radius:2px;background:var(--ac)}
.empty{color:var(--mut);text-align:center;padding:16px 0;font-size:14px}

.b.sel{outline:3px solid var(--fg);outline-offset:2px}
.plus{flex:none;color:var(--mut)}

@media (prefers-reduced-motion:reduce){.b{animation:none}}
.mini{margin-left:auto;flex:none;border:1px solid var(--bd);background:#fff;border-radius:999px;padding:4px 10px;font-size:12px}
.tools{display:flex;gap:8px;margin-top:10px}
.tools button{flex:1;border-radius:14px;background:#f0f1f5;padding:10px;font-size:14px}
.stbar{margin-top:10px}
.pill{border:1px solid var(--bd);border-radius:999px;padding:6px 16px;font-size:13px;font-weight:600;background:#fff}
.pill.on{background:var(--ac);border-color:transparent;color:#fff}
.stp{margin-top:8px}
.gl{font-size:13px;font-weight:600;margin:8px 0 6px}
#stats .gr{display:flex;flex-wrap:wrap;gap:7px}
.sc{--c:var(--red);position:relative;width:34px;height:34px;padding:0;border-radius:50%;border:1px solid var(--bd);background:#fff;font-size:12.5px;color:var(--fg)}
.sc.u{--c:var(--blue)}
.sc::before{content:"";position:absolute;inset:-1px;border-radius:50%;background:var(--c);opacity:var(--h,0)}

.sc.sel{outline:3px solid var(--fg);outline-offset:1px}

.pickbar #pkFix{background:var(--ac);color:#fff}
.ci{display:flex;align-items:center;gap:8px;margin:6px 0;font-size:14px}
.ci input{flex:1;min-width:0;border:1px solid var(--bd);border-radius:12px;padding:7px 10px;font-size:16px;background:#fff}
.note{text-align:center;color:var(--mut);font-size:12px;margin:18px 0 10px}
.bar{position:fixed;left:50%;bottom:calc(12px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:calc(100% - 24px);max-width:536px;display:flex;align-items:center;gap:12px;padding:9px 14px;border-radius:22px;background:var(--bar);color:#fff;box-shadow:0 10px 24px rgba(0,0,0,.25);z-index:20}
.clr{flex:none;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:11px;line-height:1.1}
.clr svg{width:22px;height:22px}
.bd{flex:none;width:1px;align-self:stretch;background:rgba(255,255,255,.3)}
.bar .step{background:rgba(255,255,255,.18)}
.gob{margin-left:auto;background:var(--btn);color:var(--btx);font-weight:700;font-size:18px;padding:11px 30px;border-radius:999px;box-shadow:inset 0 -3px 0 rgba(0,0,0,.08)}
.gob:active{transform:scale(.97)}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:rgba(20,22,30,.9);color:#fff;padding:8px 16px;border-radius:999px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:30}
.toast.on{opacity:1}
button:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
.gr{justify-items:center}
.nb{width:100%;max-width:46px;font-size:clamp(15px,4.4vw,18px)}
.tnm{font-size:clamp(14.5px,4.2vw,16px)}
@media (min-width:768px){
.top{max-width:680px;margin:20px auto 0;border-radius:26px 26px 0 0;padding-bottom:26px}

.card{margin-left:22px;margin-right:22px}

.bar{max-width:656px}
.gr{gap:14px 12px}
}

.pickbar{bottom:calc(12px + env(safe-area-inset-bottom,0px))}
@media (min-width:768px){.bar{max-width:none}}
.ttl{display:flex;align-items:center;gap:10px}
.logo{flex:none;width:28px;height:28px;border-radius:50%;background-color:var(--btn);background-image:var(--gl);box-shadow:var(--sh)}
.top{position:relative;overflow:hidden}

@media (min-width:768px){.drawcard{margin:16px 22px}.drawbar{padding-left:16px;padding-right:16px}.nextd{padding-left:16px}}
.nb{max-width:38px;font-size:clamp(13.5px,4vw,16px);box-shadow:0 2px 6px rgba(30,40,70,.1),inset 0 -2px 3px rgba(30,40,70,.05)}
.gr{gap:10px 6px}
.nb.dan{font-weight:700;text-shadow:0 1px 2px rgba(0,0,0,.35);transform:scale(1.07);animation:pick .28s cubic-bezier(.3,1.6,.5,1);
background-image:radial-gradient(circle at 33% 26%,rgba(255,255,255,.95) 0,rgba(255,255,255,.5) 9%,rgba(255,255,255,0) 30%),radial-gradient(circle at 50% 50%,rgba(0,0,0,0) 52%,rgba(0,0,0,.3) 100%),radial-gradient(circle at 50% 110%,rgba(255,255,255,.3) 0,rgba(255,255,255,0) 45%);
box-shadow:inset 0 -5px 8px rgba(0,0,0,.3),inset 0 2px 3px rgba(255,255,255,.4),0 6px 12px rgba(0,0,0,.28)}

</style>

<body>
<header class="top">
<div class="tt"><div class="ttl"><i class="logo"></i><div><h1>机选号码</h1><span class="tdt" id="tdt"></span></div></div><div class="quick" id="quick"></div></div>
<noscript><p style="padding:8px 16px;margin:0;font-size:13px">当前的打开方式不支持运行程序，请用 Safari 或 Chrome 浏览器打开页面链接。</p></noscript>
<nav class="tabs" id="tabs" aria-label="选择玩法"></nav>
</header>
<main class="sheet">
<div class="drawcard"><div class="drawbar" id="today"></div><div class="nextd" id="nextd"></div></div>
<div class="krow" id="kRow" hidden>选 <div class="step"><button data-k="-1" aria-label="减少">−</button><output id="kv">10</output><button data-k="1" aria-label="增加">+</button></div> 个</div>
<div id="grids"></div>
<section class="card">
<div class="bar">
<div class="seg"><button id="mDan" aria-pressed="true">固定</button><button id="mKill" aria-pressed="false">排除</button></div>
<div class="step"><button data-n="-1" aria-label="减少">−</button><output id="nv">10</output><button data-n="1" aria-label="增加">+</button></div>
<button class="gob" id="go">机选</button>
</div>
<div id="out"><div class="empty">点“机选”生成</div></div>
<div class="stbar" id="stbar" hidden><button class="pill" id="stBtn">号码统计 ▾</button></div>
<div id="stats"></div>
<div class="pickbar" id="pickBar" hidden>已选 <b id="pkn">0</b> 个<span id="pkc"></span>：<button id="pkFix">设为固定</button><button id="pkEx">设为排除</button><button id="pkClr">取消</button></div>
<div class="tools"><button id="copy">复制全部</button><button id="clr">清空结果</button></div>
</section>
<h2>我的固定号码</h2>
<section class="card"><div id="mine"></div><div id="mineIn" style="margin-top:10px"></div><div class="tools"><button id="mAdd">添加号码</button></div><div id="mineOut"></div></section>
<p class="note">理性购彩，量力而行</p>
</main>
<div class="toast" id="toast"></div>

};
var THM={
dlt:{h1:'#1b5fd6',h2:'#2f81ea',ac:'#2a74e6',bm:'#2a74e6',bs:'#f39a1e',bar:'#1f68de',btn:'#ffd321',btx:'#3b2a00'},

function lum(h){var c=[1,3,5].map(function(i){var v=parseInt(h.substr(i,2),16)/255;return v<=0.03928?v/12.92:Math.pow((v+0.055)/1.055,2.4)});return 0.2126*c[0]+0.7152*c[1]+0.0722*c[2]}

 r.setProperty('--h1',t.h1);r.setProperty('--h2',t.h2);r.setProperty('--ac',t.ac);r.setProperty('--red',t.bm);r.setProperty('--blue',t.bs);r.setProperty('--bar',t.bar);r.setProperty('--btn',t.btn);r.setProperty('--btx',t.btx);

function pick(p,c,ex){
