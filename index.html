<body>
<main>
<header class="hero"><h1>机选号码</h1>
<noscript><p class="sub" style="color:var(--red);font-weight:600">当前的打开方式不支持运行程序，请用 Safari 或 Chrome 浏览器打开页面链接。</p></noscript>
<p class="sub">福彩、体彩常见玩法，手机电脑通用</p>
<div class="today" id="today"></div></header>
<div class="tabs" id="tabs" role="group" aria-label="选择玩法"></div>
<section class="panel">
  <p class="rule" id="rule"></p>
  <div class="row" id="kRow" hidden><span>选几个号</span><div class="step"><button data-k="-1" aria-label="减少">−</button><output id="kv">10</output><button data-k="1" aria-label="增加">+</button></div></div>
  <div class="row"><span>生成注数</span><div class="step"><button data-n="-1" aria-label="减少">−</button><output id="nv">5</output><button data-n="1" aria-label="增加">+</button></div></div>
  <details class="dk" open><summary>固定号码 / 排除号码（可选）</summary>
<p class="rule" style="margin-top:8px">先选“固定”或“排除”，再点号码。固定的号码每一注都会包含，其余的号码由机选补齐；排除的号码一定不会出现。数字类玩法按位设置：该位有胆码时只在胆码里选。</p>
<div class="tabs"><button class="tab" id="mDan" aria-pressed="true">固定</button><button class="tab" id="mKill" aria-pressed="false">排除</button><button class="tab" id="mClr">全部清除</button></div>
<div id="grids"></div></details>
<button class="go" id="go">机选号码</button>
</section>
<section class="panel" style="margin-top:12px">
  <div id="out"><div class="empty">点“机选号码”生成</div></div>
  <div class="tools"><button id="copy">复制全部</button><button id="clr">清空结果</button></div>
</section>
<h2>我的固定号码</h2>
<section class="panel"><p class="rule">天天购买的号码存在这里，只保存在你当前设备的浏览器里。机选结果每行右边的“存”可以直接加入，也可以手动添加。</p><div id="mine"></div><div id="mineIn" style="margin-top:10px"></div><div class="tools"><button id="mAdd">添加号码</button></div><div id="mineOut"></div></section>
<p class="note">号码由浏览器的加密级随机数生成，每注中奖概率相同，不存在“好号”或规律。请量力而行，理性购彩，未成年人不得购买彩票。</p>
</main>

function rnd(a,z){var r=z-a+1,m=Math.floor(4294967296/r)*r,b=new Uint32Array(1);do{crypto.getRandomValues(b)}while(b[0]>=m);return a+b[0]%r}
function pad(v,d){return d?String(v):(v<10?'0'+v:String(v))}
function pick(p,c,ex){
  var out=[];
  if(p.q){var pool=[];for(var v=p.a;v<=p.z;v++)if(!ex||ex.indexOf(v)<0)pool.push(v);
    for(var i=0;i<c;i++){var j=i+rnd(0,pool.length-i-1),t=pool[i];pool[i]=pool[j];pool[j]=t;out.push(pool[i])}
    out.sort(function(a,b){return a-b})}
  else for(var i=0;i<c;i++)out.push(rnd(p.a,p.z));
  return out}
function one(){var g=G[cur],res=[],si=0;
 g.p.forEach(function(p,pi){var c=(g.k&&pi===0)?kk:p.c,v=[];
  if(p.q){var st=sel[cur][si++]||{},dan=[],pool=[];
   for(var x=p.a;x<=p.z;x++){if(st[x]===1)dan.push(x);else if(!st[x])pool.push(x)}
   var rest=c-dan.length;
   if(rest<0)throw new Error('固定号码不能超过 '+c+' 个');
   if(pool.length<rest)throw new Error('排除的号码太多，剩余号码不够');
   for(var i=0;i<rest;i++){var j=i+rnd(0,pool.length-i-1),t=pool[i];pool[i]=pool[j];pool[j]=t;dan.push(pool[i])}
   v=dan.sort(function(a,b){return a-b})}
  else for(var k=0;k<c;k++){var s2=sel[cur][si++]||{},d=[],pl=[];
   for(var y=p.a;y<=p.z;y++){if(s2[y]===1)d.push(y);else if(!s2[y])pl.push(y)}
   var ch=d.length?d:pl;if(!ch.length)throw new Error('第 '+si+' 位的数字被全部杀掉了');v.push(ch[rnd(0,ch.length-1)])}
  res.push({t:p.t,d:p.d,v:v})});
 return res}
function oneOld(){
  var g=G[cur],res=[],first=[];
  g.p.forEach(function(p,i){
    var c=(g.k&&i===0)?kk:p.c;
    var s=pick(p,c,p.x?first:null);if(i===0)first=s;
    res.push({t:p.t,d:p.d,v:s})});
  return res}
function txt(t){return t.map(function(s){return s.v.map(function(v){return pad(v,s.d)}).join(s.d?'':' ')}).join(' + ')}
function render(){
  var o=$('out');o.innerHTML='';
  if(!rows.length){o.innerHTML='<div class="empty">点“机选号码”生成</div>';return}
  rows.forEach(function(t,ri){
    var d=document.createElement('div');d.className='ticket';
    var ix=document.createElement('span');ix.className='idx';ix.textContent=ri+1;d.appendChild(ix);
    var n=0;
    t.forEach(function(s,si){
      if(si>0){var pl=document.createElement('span');pl.className='plus';pl.textContent='+';d.appendChild(pl)}
      s.v.forEach(function(v,vi){var b=document.createElement('span');b.className='b '+s.t;b.style.setProperty('--i',n++);b.textContent=pad(v,s.d);d.appendChild(b)})});
    var sv=document.createElement('button');sv.className='mini';sv.textContent='存';sv.title='存为我的固定号码';sv.onclick=function(){addMine(t)};d.appendChild(sv);o.appendChild(d)})}
function toast(m){var t=$('toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.h);toast.h=setTimeout(function(){t.classList.remove('on')},1400)}
function loadH(){try{return JSON.parse(localStorage.getItem(HK)||'[]')}catch(e){return[]}}
function saveH(){
  try{var h=loadH();h.unshift({g:G[cur].n,t:new Date().toLocaleString('zh-CN',{hour12:false}),r:rows.map(txt)});localStorage.setItem(HK,JSON.stringify(h.slice(0,10)))}catch(e){}
  showH()}
function showH(){
  var h=loadH(),e=$('hist');
  if(!h.length){e.innerHTML='<div class="h">暂无记录</div>';return}
  e.innerHTML='';
  h.forEach(function(x){var d=document.createElement('div');d.className='h';
    var b=document.createElement('b');b.textContent=x.g+' '+x.t;d.appendChild(b);
    x.r.forEach(function(l){d.appendChild(document.createElement('br'));d.appendChild(document.createTextNode(l))});
    e.appendChild(d)})}
function tabs(){
  var t=$('tabs');banner();t.innerHTML='';
  ORDER.forEach(function(k){
    var b=document.createElement('button');b.className='tab'+(isToday(k)?' td':'');b.setAttribute('aria-pressed',k===cur);b.style.setProperty('--a',TH[k][0]);b.style.setProperty('--b',TH[k][1]);
    b.textContent=G[k].n;
    b.onclick=function(){cur=k;rows=[];tabs();info();grids();mineInit();showMine();render()};
    t.appendChild(b)})}
function info(){applyTheme(cur);$('rule').textContent=G[cur].rule+'。开奖：'+days(cur);$('kRow').hidden=!G[cur].k;$('kv').textContent=kk;$('nv').textContent=cnt}
document.addEventListener('click',function(e){
  var n=e.target.getAttribute&&e.target.getAttribute('data-n'),k=e.target.getAttribute&&e.target.getAttribute('data-k');
  if(n){cnt=Math.max(1,Math.min(20,cnt+ +n));info()}
  if(k){kk=Math.max(1,Math.min(10,kk+ +k));info()}});
$('go').onclick=function(){var r=[];try{for(var i=0;i<cnt;i++)r.push(one())}catch(e){toast(e.message);return}rows=r;render()};
$('clr').onclick=function(){rows=[];render()};
$('copy').onclick=function(){
  if(!rows.length){toast('还没有号码');return}
  var s=G[cur].n+'\n'+rows.map(function(t,i){return(i+1)+'. '+txt(t)}).join('\n');
  function fb(){var a=document.createElement('textarea');a.value=s;document.body.appendChild(a);a.select();try{document.execCommand('copy');toast('已复制')}catch(e){toast('复制失败，请手动选取')}document.body.removeChild(a)}
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(s).then(function(){toast('已复制')},fb);else fb()};
var mode=1,sel={},LBL={ssq:['红球','蓝球'],dlt:['前区','后区']};
function slots(){var g=G[cur],o=[],n=0;g.p.forEach(function(p,i){if(p.q)o.push({l:(LBL[cur]||[])[i]||'号码',a:p.a,z:p.z,d:p.d,t:p.t});else for(var j=0;j<p.c;j++)o.push({l:'第 '+(++n)+' 位',a:p.a,z:p.z,d:1,t:p.t})});return o}
function grids(){
 var S=slots();if(!sel[cur])sel[cur]=S.map(function(){return{}});
 var el=$('grids');el.innerHTML='';
 S.forEach(function(s,i){var w=document.createElement('div'),h=document.createElement('div'),gr=document.createElement('div');
  h.className='gl';h.textContent=s.l;gr.className='gr';w.appendChild(h);
  for(var v=s.a;v<=s.z;v++)(function(v){var b=document.createElement('button'),st=sel[cur][i][v]||0;
   b.className='nb'+(st===1?' dan':st===2?' kill':'')+(s.t==='u'?' u':'');b.textContent=pad(v,s.d);
   b.onclick=function(){var o=sel[cur][i];if(o[v]===mode)delete o[v];else o[v]=mode;grids()};gr.appendChild(b)})(v);
  w.appendChild(gr);el.appendChild(w)})}
function setMode(m){mode=m;$('mDan').setAttribute('aria-pressed',m===1);$('mKill').setAttribute('aria-pressed',m===2)}
$('mDan').onclick=function(){setMode(1)};$('mKill').onclick=function(){setMode(2)};
$('mClr').onclick=function(){delete sel[cur];grids()};
var WD=['日','一','二','三','四','五','六'],ALL=[0,1,2,3,4,5,6];
var SCH={ssq:{d:[2,4,0],t:'21:15'},dlt:{d:[1,3,6],t:'20:30'},kl8:{d:ALL,t:'21:30'},qlc:{d:[1,3,5],t:'21:15'},d3:{d:ALL,t:'21:15'},p3:{d:ALL,t:'20:30'},p5:{d:ALL,t:'20:30'},qxc:{d:[2,5,0],t:'20:30'}};
function days(k){var s=SCH[k];if(s.d.length===7)return'每天';return'周'+[1,2,3,4,5,6,0].filter(function(x){return s.d.indexOf(x)>=0}).map(function(x){return WD[x]}).join('、')}
function nowInfo(k){var s=SCH[k],n=new Date(),hm=n.getHours()*60+n.getMinutes(),t=s.t.split(':'),on=s.d.indexOf(n.getDay())>=0;return{on:on,done:on&&hm>=(+t[0])*60+(+t[1])}}
function pickDefault(){var t=(new Date().getDay()+1)%7,i;for(i=0;i<ORDER.length;i++)if(isToday(ORDER[i]))return ORDER[i];for(i=0;i<ORDER.length;i++)if(SCH[ORDER[i]].d.indexOf(t)>=0)return ORDER[i];return ORDER[0]}
function isToday(k){var i=nowInfo(k);return i.on&&!i.done}
function sch(k){var s=SCH[k],d=new Date().getDay(),i=nowInfo(k);
 if(i.on&&!i.done)return '今晚 '+s.t+' 开奖';
 var nx='';for(var j=1;j<=7;j++){var x=(d+j)%7;if(s.d.indexOf(x)>=0){nx=j===1?'明天':'周'+WD[x];break}}
 return (i.done?'今日已开奖，':'')+'下次 '+nx}
function banner(){var n=new Date(),on=[],dn=[],e=$('today');
 ORDER.forEach(function(k){var i=nowInfo(k);if(i.on&&!i.done)on.push([G[k].n,SCH[k].t]);else if(i.on)dn.push(G[k].n)});
 var h='<div class="dt"><span class="dd">'+(n.getMonth()+1)+'月'+n.getDate()+'日</span><span class="dw">周'+WD[n.getDay()]+'</span></div>';
 h+='<div class="tl">'+(on.length?'今晚开奖':'今晚没有开奖的玩法')+'</div>';
 if(on.length)h+='<div class="chips">'+on.map(function(x){return '<span class="chip">'+x[0]+'<i>'+x[1]+'</i></span>'}).join('')+'</div>';
 if(dn.length)h+='<div class="hn">今日已开奖：'+dn.join('、')+'</div>';
 h+='<div class="hn">彩色背景的玩法今晚开奖，购买请留意售票点的停售时间。</div>';
 e.innerHTML=h}
function loadM(){try{return JSON.parse(localStorage.getItem('lotto-mine')||'{}')}catch(e){return{}}}
var MINE=loadM();
function saveM(){try{localStorage.setItem('lotto-mine',JSON.stringify(MINE))}catch(e){toast('浏览器禁止存储，关闭页面后会丢失')}}
function addMine(t){var l=MINE[cur]||(MINE[cur]=[]),s=txt(t);if(l.some(function(x){return txt(x)===s})){toast('已经存过了');return}l.push(t);saveM();showMine();toast('已加入我的固定号码')}
function showMine(){var o=$('mine'),l=MINE[cur]||[];o.innerHTML='';$('mineOut').innerHTML='';
 if(!l.length){o.innerHTML='<div class="empty">这个玩法还没有固定号码</div>';return}
 l.forEach(function(t,i){var d=document.createElement('div'),n=0;d.className='ticket';
  t.forEach(function(s,si){if(si>0){var pl=document.createElement('span');pl.className='plus';pl.textContent='+';d.appendChild(pl)}
   s.v.forEach(function(v){var b=document.createElement('span');b.className='b '+s.t;b.style.setProperty('--i',n++);b.textContent=pad(v,s.d);d.appendChild(b)})});
  var x=document.createElement('button');x.className='mini';x.textContent='删除';x.onclick=function(){MINE[cur].splice(i,1);saveM();showMine()};d.appendChild(x);o.appendChild(d)})}
function mineInit(){var e=$('mineIn'),g=G[cur];e.innerHTML='';
 g.p.forEach(function(p,i){var l=document.createElement('label'),n=document.createElement('input');l.className='ci';
  l.appendChild(document.createTextNode(LBL[cur]?LBL[cur][i]:cur==='qxc'?['前6位','第7位'][i]:'号码'));
  n.type='text';n.inputMode='numeric';n.id='mi'+i;n.placeholder=(g.k&&i===0?'1–10':p.c)+' 个号码，空格分隔';l.appendChild(n);e.appendChild(l)})}
function addManual(){var g=G[cur],t=[];
 for(var i=0;i<g.p.length;i++){var p=g.p[i],s=$('mi'+i).value.trim(),a;
  if(p.d&&p.c>1&&/^\d+$/.test(s)&&s.length===p.c)a=s.split('').map(Number);else a=(s.match(/\d+/g)||[]).map(Number);
  var ok=g.k&&i===0?(a.length>=1&&a.length<=10):a.length===p.c;
  if(!ok||a.some(function(x){return x<p.a||x>p.z})||(p.q&&new Set(a).size!==a.length)){toast('第 '+(i+1)+' 组需要 '+(g.k&&i===0?'1–10':p.c)+' 个 '+p.a+'–'+p.z+(p.q?'，不能重复':'')+' 的号码');return}
  t.push({t:p.t,d:p.d,v:p.q?a.sort(function(x,y){return x-y}):a})}
 g.p.forEach(function(p,i){$('mi'+i).value=''});addMine(t)}
$('mAdd').onclick=addManual;
cur=pickDefault();tabs();info();grids();setMode(1);mineInit();showMine();
</script>
</body>
